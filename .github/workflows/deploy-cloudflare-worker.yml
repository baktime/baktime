name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Sync the Worker's GH_PAT secret
        # Idempotent — `wrangler secret put` just overwrites, so it's safe to
        # run on every deploy. Keeps the Worker's dispatch token rotatable
        # through the same GitHub secret everything else uses, scoped to
        # exactly this repo with minimal scopes (see docs/secrets.md).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: echo "$GH_PAT" | npx wrangler secret put GH_PAT
