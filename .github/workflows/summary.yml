name: Weekly backup summary

# Sends one aggregate report every Monday. The off-hour minute reduces the
# chance of GitHub's documented top-of-hour schedule delays. workflow_dispatch
# provides an immediate setup/test path after configuring notifications.
on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install restic decompression dependency
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends bzip2
      - name: Send weekly summary
        env:
          BAKTIME_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: node dist/cli/send-weekly-summary.js
